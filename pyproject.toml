[tool.poetry]
name = "thrombophilia-risk-mining"
version = "0.3.0"
description = "Advanced object-oriented framework for clinical gatekeeping and joint probability mining on thrombophilia data."
authors = ["Lucia Ordieres-Ortega <lucia.ordieres@salud.madrid.org>"]
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "^3.10"
pandas = ">=2.2,<4"
numpy = ">=1.26,<3"
openpyxl = "^3.1.2"
pyarrow = "^23.0.0"
scikit-learn = "^1.4.0"
xgboost = "^2.0.0"
mlxtend = "^0.23.1"
plotly = ">=5.19,<7"
pgmpy = "^0.1.25"
umap-learn = "^0.5.5"
scipy = ">=1.12,<2"
joblib = ">=1.3,<2"
matplotlib = ">=3.8,<4"

[tool.poetry.group.dev.dependencies]
pytest = ">=8,<10"

[tool.poetry.group.docs.dependencies]
sphinx = ">=7,<9"
furo = ">=2024.1"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
thrombomining = "src.cli:main"
